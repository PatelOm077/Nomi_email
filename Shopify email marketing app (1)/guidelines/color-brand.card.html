<!-- @dsCard group="Colors" viewport="700x150" subtitle="Ink, paper, cyan, magenta" name="Brand colors" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="background:var(--surface-page);padding:var(--space-4)">
<div style="display:flex;gap:var(--space-4)">
  <div><div style="width:120px;height:72px;border-radius:var(--radius-sm);background:var(--nomi-ink)"></div><p style="font:italic 12px var(--font-body);color:var(--text-muted);margin:6px 0 0">Ink #201e1d</p></div>
  <div><div style="width:120px;height:72px;border-radius:var(--radius-sm);background:var(--nomi-paper);box-shadow:var(--shadow-sm)"></div><p style="font:italic 12px var(--font-body);color:var(--text-muted);margin:6px 0 0">Paper #f3f2f2</p></div>
  <div><div style="width:120px;height:72px;border-radius:var(--radius-sm);background:var(--nomi-cyan)"></div><p style="font:italic 12px var(--font-body);color:var(--text-muted);margin:6px 0 0">Cyan #0088b0</p></div>
  <div><div style="width:120px;height:72px;border-radius:var(--radius-sm);background:var(--nomi-cyan-text)"></div><p style="font:italic 12px var(--font-body);color:var(--text-muted);margin:6px 0 0">Cyan text #00789e</p></div>
  <div><div style="width:120px;height:72px;border-radius:var(--radius-sm);background:var(--nomi-magenta)"></div><p style="font:italic 12px var(--font-body);color:var(--text-muted);margin:6px 0 0">Magenta #d6006c</p></div>
</div>
</body></html>
