<!-- @dsCard group="Components" viewport="700x220" name="Core" subtitle="Button, Tag, Input, Card" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body style="background:var(--surface-page);padding:var(--space-4)">
<div id="root"></div>
<script type="text/babel">
const ns = Object.values(window).find(v => v && typeof v === 'object' && v.Button && v.Tag && v.Input && v.Card) || {};
const { Button, Tag, Input, Card } = ns;
function Demo() {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--space-4)' }}>
      <div style={{ display: 'flex', gap: 'var(--space-2)', alignItems: 'center', flexWrap: 'wrap' }}>
        <Button variant="primary">Send now</Button>
        <Button variant="secondary">Schedule</Button>
        <Button variant="ghost">Preview</Button>
        <Button variant="primary" size="sm">Small</Button>
        <Button variant="primary" disabled>Disabled</Button>
      </div>
      <div style={{ display: 'flex', gap: 'var(--space-2)', alignItems: 'center', flexWrap: 'wrap' }}>
        <Tag>Draft</Tag>
        <Tag tone="cyan">Scheduled</Tag>
        <Tag tone="magenta">Failed</Tag>
      </div>
      <div style={{ display: 'flex', gap: 'var(--space-4)', alignItems: 'flex-start' }}>
        <div style={{ width: 260 }}><Input id="subject" label="Subject" placeholder="Spring restock" /></div>
        <div style={{ width: 260 }}><Card title="Spring restock" meta="Scheduled Thursday, 9:00">2,140 subscribers</Card></div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
