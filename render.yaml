services:
  - type: web
    name: nomi
    runtime: docker
    plan: starter
    healthCheckPath: /
    disk:
      name: nomi-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/var/data/nomi.sqlite
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCOPES
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NOMI_FROM_EMAIL
        sync: false
      - key: NOMI_FROM_NAME
        sync: false
      - key: EMAIL_JOB_SECRET
        sync: false
